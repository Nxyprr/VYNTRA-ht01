services:
  db:
    image: postgres:16
    environment: {POSTGRES_USER: vyntra, POSTGRES_PASSWORD: vyntra, POSTGRES_DB: vyntra}
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://vyntra:vyntra@db:5432/vyntra
      JWT_SECRET: cambia-esto-en-produccion
    ports: ["8000:8000"]
    depends_on: [db]
volumes: {pgdata: {}}
