
services:
  - type: web
    name: vyntra-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_REGEX
        value: https://.*\.(onrender\.com|vercel\.app)
      - key: ADMIN_PASSWORD
        sync: false
      - key: EST_PASSWORD
        sync: false
      - key: INS_PASSWORD
        sync: false

  - type: web
    name: vyntra-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.17.0
      - key: VITE_API_URL
        value: https://vyntra-api.onrender.com
      - key: VITE_DEMO_LOGIN
        value: "false"
